<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>InterruptGPT — Linux Interrupt Troubleshooter</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b22; --border: #262d38;
    --ink: #e6edf3; --muted: #8b949e;
    --crit: #f85149; --warn: #d29922; --ok: #3fb950; --accent: #58a6ff;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  .backend { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 24px 28px; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  textarea, input[type=text] {
    width: 100%; background: #0d1117; color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px;
    font-family: var(--mono); font-size: 13px; resize: vertical;
  }
  textarea { min-height: 150px; }
  .row { margin-bottom: 16px; }
  button {
    background: var(--accent); color: #06121f; border: 0; border-radius: 8px;
    padding: 10px 18px; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button:disabled { opacity: .55; cursor: progress; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .finding { border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
  .finding.critical { border-left-color: var(--crit); }
  .finding.warning  { border-left-color: var(--warn); }
  .finding.info     { border-left-color: var(--ok); }
  .ftitle { font-weight: 700; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .conf { font-family: var(--mono); font-size: 13px; color: var(--muted); white-space: nowrap; }
  .bar { height: 4px; background: #21262d; border-radius: 2px; margin: 8px 0 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  ul { margin: 8px 0 0; padding-left: 20px; }
  li { margin: 3px 0; font-size: 14px; }
  .evidence li { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .ref { font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .ref:last-child { border-bottom: 0; }
  .ref b { color: var(--accent); font-weight: 600; }
  pre {
    white-space: pre-wrap; word-break: break-word; background: #0d1117;
    border: 1px solid var(--border); border-radius: 8px; padding: 14px;
    font-family: var(--mono); font-size: 12.5px; max-height: 460px; overflow: auto;
  }
  .empty { color: var(--muted); font-size: 14px; }
  .err { color: var(--crit); font-size: 14px; }
  h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
</style>
</head>
<body>
<header>
  <h1>InterruptGPT</h1>
  <span class="sub">RAG-based Linux kernel interrupt troubleshooter</span>
  <span class="backend" id="backend">connecting…</span>
</header>

<main>
  <section>
    <div class="card">
      <div class="row">
        <label for="dmesg">dmesg / journalctl</label>
        <textarea id="dmesg" placeholder="[  312.774519] irq 16: nobody cared (try booting with the &quot;irqpoll&quot; option)"></textarea>
      </div>
      <div class="row">
        <label for="interrupts">/proc/interrupts</label>
        <textarea id="interrupts" placeholder="           CPU0       CPU1&#10;  16:   418922   112   IO-APIC  16-fasteoi  ahci, eth0"></textarea>
      </div>
      <div class="row">
        <label for="question">Question (optional)</label>
        <input type="text" id="question" placeholder="Why was IRQ 16 disabled?" />
      </div>
      <div class="actions">
        <button id="run">Analyze</button>
        <button class="secondary" id="sample">Load sample</button>
        <button class="secondary" id="download" disabled>Download report</button>
      </div>
    </div>
  </section>

  <section>
    <div class="card" style="margin-bottom:20px">
      <h3>Findings</h3>
      <div id="findings"><p class="empty">Run an analysis to see results.</p></div>
    </div>
    <div class="card" style="margin-bottom:20px">
      <h3>Documentation references</h3>
      <div id="refs"><p class="empty">—</p></div>
    </div>
    <div class="card">
      <h3>Report</h3>
      <pre id="report">—</pre>
    </div>
  </section>
</main>

<script>
const API = location.port === "8000" ? "" : "http://localhost:8000";
const $ = id => document.getElementById(id);
let lastReport = "";

const SAMPLE_DMESG = `[    1.204698] ahci 0000:00:1f.2: irq 16 for MSI/MSI-X failed, falling back to INTx
[    2.884201] e1000e 0000:02:00.0: irq 16 assigned (shared)
[  312.774519] irq 16: nobody cared (try booting with the "irqpoll" option)
[  312.774523] handlers:
[  312.774529] [<ffffffff810f0f70>] ahci_interrupt
[  312.774534] [<ffffffff81102ab0>] usb_hcd_irq
[  312.774540] Disabling IRQ #16`;

const SAMPLE_INTERRUPTS = `           CPU0       CPU1       CPU2       CPU3
 16:     418922        112         98        104   IO-APIC   16-fasteoi   ahci, uhci_hcd:usb1, eth0
 18:       3311        220        198        201   IO-APIC   18-fasteoi   i915
ERR:       1847`;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function health() {
  try {
    const r = await fetch(API + "/health");
    const j = await r.json();
    $("backend").textContent = `llm: ${j.llm_backend} · retrieval: ${j.retrieval_backend} · ${j.documents_indexed} docs`;
  } catch {
    $("backend").textContent = "backend unreachable — is uvicorn running on :8000?";
  }
}

function renderFindings(findings) {
  if (!findings.length) {
    $("findings").innerHTML = '<p class="empty">No interrupt anomalies detected.</p>';
    return;
  }
  $("findings").innerHTML = findings.map(f => `
    <div class="finding ${esc(f.severity)}">
      <div class="ftitle">
        <span>${esc(f.title)}</span>
        <span class="conf">${Math.round(f.confidence * 100)}%</span>
      </div>
      <div class="bar"><i style="width:${Math.round(f.confidence * 100)}%"></i></div>
      ${f.evidence.length ? `<ul class="evidence">${f.evidence.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
      ${f.recommendations.length ? `<ul>${f.recommendations.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    </div>`).join("");
}

function renderRefs(refs) {
  $("refs").innerHTML = refs.length
    ? refs.map(r => `<div class="ref"><b>${esc(r.title)}</b><br><span class="empty">${esc(r.source)} · relevance ${r.score.toFixed(3)}</span></div>`).join("")
    : '<p class="empty">—</p>';
}

$("sample").onclick = () => {
  $("dmesg").value = SAMPLE_DMESG;
  $("interrupts").value = SAMPLE_INTERRUPTS;
  $("question").value = "Why was IRQ 16 disabled?";
};

$("run").onclick = async () => {
  const btn = $("run");
  btn.disabled = true; btn.textContent = "Analyzing…";
  try {
    const r = await fetch(API + "/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        dmesg: $("dmesg").value,
        proc_interrupts: $("interrupts").value,
        question: $("question").value || null,
      }),
    });
    if (!r.ok) {
      const detail = await r.json().catch(() => ({}));
      throw new Error(detail.detail || `HTTP ${r.status}`);
    }
    const data = await r.json();
    renderFindings(data.findings);
    renderRefs(data.references);
    $("report").textContent = data.report_markdown;
    lastReport = data.report_markdown;
    $("download").disabled = false;
  } catch (e) {
    $("findings").innerHTML = `<p class="err">${esc(e.message)}</p>`;
  } finally {
    btn.disabled = false; btn.textContent = "Analyze";
  }
};

$("download").onclick = () => {
  const blob = new Blob([lastReport], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "interrupt-report.md";
  a.click();
  URL.revokeObjectURL(a.href);
};

health();
</script>
</body>
</html>
