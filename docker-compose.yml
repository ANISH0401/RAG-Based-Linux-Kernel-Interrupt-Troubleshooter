services:
  api:
    build: .
    image: interrupt-gpt:latest
    ports:
      - "8000:8000"
    environment:
      # Point at the Ollama service below; omit to use the deterministic backend.
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
