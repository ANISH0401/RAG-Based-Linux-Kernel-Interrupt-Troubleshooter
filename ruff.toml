line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# UP042: str+Enum is intentional - keeps values JSON-serialisable on 3.11.
ignore = ["E501", "UP042"]

[lint.per-file-ignores]
# B008: Depends()/File() in defaults is the documented FastAPI idiom.
"backend/app/main.py" = ["B008"]
"tests/*" = ["E402"]
"scripts/*" = ["E402"]
